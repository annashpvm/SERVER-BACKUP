<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Trial Balance - ExtJS 4.1</title>

<!-- ✅ EXTJS 4 CSS -->
<link rel="stylesheet" href="/ext-4.1/resources/css/ext-all.css">

<!-- ✅ EXTJS 4 JS -->
<script src="/ext-4.1/ext-all.js"></script>

<script>
Ext.onReady(function () {

    var store = Ext.create('Ext.data.TreeStore', {

model: Ext.define('TrialBalanceModel', {
    extend: 'Ext.data.Model',
    fields: [
        { name: 'text', type: 'string' },
        { name: 'debit', type: 'float' },
        { name: 'credit', type: 'float' },
        { name: 'level', type: 'string' },
        { name: 'mgrpcode', type: 'int' },
        { name: 'subgrp', type: 'int' },
        { name: 'subgrp2', type: 'int' }
    ]
}),

proxy: {
    type: 'ajax',
    url: 'getTrialBalanceTree.php',
    reader: {
        type: 'json',
        root: 'children'
    },
    extraParams: {
        level: 'GROUP',
        finid: 25,
        compcode: 1,
        startdate: '2025-04-01',
        enddate: '2026-03-31',
        finfirstdate: '2025-04-01'
    }
},

root: {
    text: 'Root',
    expanded: true
},

listeners: {
    beforeload: function (store, operation) {
        var node = operation.node;

        store.getProxy().extraParams.level = node.get('level') || 'GROUP';
        store.getProxy().extraParams.mgrpcode = node.get('mgrpcode') || 0;
        store.getProxy().extraParams.subgrp = node.get('subgrp') || 0;
        store.getProxy().extraParams.subgrp2 = node.get('subgrp2') || 0;
    }
}
});
    Ext.create('Ext.tree.Panel', {

        title: 'Trial Balance',
        width: 900,
        height: 500,
        renderTo: Ext.getBody(),

        store: store,

        rootVisible: false,
        useArrows: true,
        border: true,

        columns: [
    {
        xtype: 'treecolumn',
        text: 'Particulars',
        dataIndex: 'text',
        flex: 3
    },
    {
        text: 'Debit',
        dataIndex: 'debit',
        flex: 1,
        align: 'right',
        renderer: function(v){
            return Ext.util.Format.number(v || 0, '0,0.00');
        }
    },
    {
        text: 'Credit',
        dataIndex: 'credit',
        flex: 1,
        align: 'right',
        renderer: function(v){
            return Ext.util.Format.number(v || 0, '0,0.00');
        }
    }
]

    });

});
</script>

<style>
body {
    margin: 20px;
}
</style>

</head>

<body>
</body>
</html>
